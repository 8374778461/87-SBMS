spring:
  application:
    name: Api-Gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: api-1
            uri: lb://welcome
            predicates:
              - Path=/welcome-msg, /welcome-txt/**
          - id: api-2
            uri: lb://greet
            predicates:
              - Path=/greet, /greet-txt/**
server:
  port: 4444